<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Resume Intelligence</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
<div class="app">

  <div class="sidebar">
    <h2>AI Recruiter</h2>
    <button>🏠 Dashboard</button>
    <button>📄 Analyze</button>
    <button>📊 Reports</button>
  </div>

  <div class="main">
    <h1>AI Resume Intelligence Dashboard</h1>

    <!-- FORM WRAPPER -->
    <form id="resumeForm" class="card upload-box">
      <h3>Upload Resume + Job Description</h3>

      <input type="file" id="resumeFile" name="resumeFile" required>
      <textarea id="jobDescription" name="jobDescription" placeholder="Paste Job Description"></textarea>

      <button type="submit">Analyze</button>
    </form>

    <!-- LOADING -->
    <div id="loading" class="loader hidden">
      <div class="spinner"></div>
      <p>AI is analyzing resume...</p>
    </div>

    <!-- RESULTS -->
    <div id="result" class="hidden result-grid">
      <div class="card">
        <h3>Match Score</h3>
        <div class="circle" id="scoreCircle">0%</div>
      </div>

      <div class="card">
        <h3>Skills Analysis</h3>
        <div id="skillsBox"></div>
      </div>

      <div class="card full">
        <h3>AI Recommendation</h3>
        <p id="recommendation"></p>
      </div>
    </div>
  </div>
</div>

<script src="js/dashboard.js"></script>
</body>
</html>
