<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Resume Intelligence</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>AI Recruiter</h2>

    <button>🏠 Dashboard</button>
    <button>📄 Analyze Resume</button>
    <button>📊 Reports</button>
    <button>⚙️ Settings</button>
  </div>

  <!-- MAIN -->
  <div class="main">

    <h1>AI Resume Intelligence Dashboard</h1>

    <!-- UPLOAD CARD -->
    <div class="card upload-box">
      <h3>Drop Resume Here</h3>
      <input type="file" id="resumeFile">
      <textarea id="jobDescription" placeholder="Paste Job Description"></textarea>
      <button onclick="analyzeResume()">Analyze with AI</button>
    </div>

    <!-- LOADING -->
    <div id="loading" class="hidden">AI is analyzing...</div>

    <!-- RESULT -->
    <div id="result" class="card result-box hidden"></div>

  </div>

</div>

<script src="js/dashboard.js"></script>
</body>
</html>
