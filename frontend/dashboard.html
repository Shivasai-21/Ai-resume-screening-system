<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analyzer Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <h2>Resume Screening Dashboard</h2>

    <form id="resumeForm">

        <input
            type="file"
            id="resumeFile"
            accept=".pdf,.doc,.docx"
            required>

        <br><br>

        <textarea
            id="jobDescription"
            placeholder="Paste Job Description Here"
            rows="8"
            cols="60"></textarea>

        <br><br>

        <button type="button" onclick="analyzeResume()">
            Analyze Resume
        </button>

    </form>

    <hr>

    <div id="result"></div>

    <script src="js/dashboard.js"></script>

</body>

</html>
